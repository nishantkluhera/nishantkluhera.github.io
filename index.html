<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nishant basic Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --primary: #2563eb;
            --primary-light: #60a5fa;
            --bg: #ffffff;
            --text: #1f2937;
            --card-bg: #ffffff;
            --card-border: #e5e7eb;
            --hover-bg: #f3f4f6;
        }

        .dark {
            --primary: #60a5fa;
            --primary-light: #93c5fd;
            --bg: #0f172a;
            --text: #e2e8f0;
            --card-bg: #1e293b;
            --card-border: #334155;
            --hover-bg: #2d3748;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .profile-card {
            display: flex;
            gap: 3rem;
            align-items: center;
        }

        .avatar-container {
            position: relative;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 1.5rem;
            object-fit: cover;
            transition: transform 0.3s;
            border: 3px solid var(--primary);
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        .name {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bio {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 1.5rem;
            line-height: 1.8;
        }

        .stats {
            display: flex;
            gap: 2rem;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        .social-links {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .social-link {
            padding: 0.75rem;
            border-radius: 0.75rem;
            color: var(--text);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: all 0.3s;
        }

        .social-link:hover {
            background: var(--hover-bg);
            transform: translateY(-2px);
        }

        .repos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .repo-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.75rem;
            transition: transform 0.3s, box-shadow 0.3s;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .repo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .repo-name {
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-decoration: none;
        }

        .repo-desc {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .repo-stats {
            display: flex;
            gap: 1.25rem;
            font-size: 0.9rem;
            opacity: 0.9;
            padding-top: 1rem;
            border-top: 1px solid var(--card-border);
        }

        .theme-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 0.75rem;
            padding: 0.75rem;
            cursor: pointer;
            font-size: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        .loading::after {
            content: "";
            width: 48px;
            height: 48px;
            border: 4px solid var(--card-border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .profile-card {
                flex-direction: column;
                text-align: center;
            }

            .stats, .social-links {
                justify-content: center;
            }

            .container {
                padding: 1rem;
            }

            .name {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    <div class="container">
        <div id="profile" class="card loading"></div>
        <div id="repos" class="loading"></div>
    </div>

    <script>
        const username = 'nishantkluhera';

        // Social media links configuration
        const socialLinks = {
            //twitter: 'your_twitter',
            linkedin: 'in/nishantkluhera',
            //instagram: 'your_instagram',
            //medium: 'your_medium'
        };

        function toggleTheme() {
            document.body.classList.toggle('dark');
            localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        }

        if (localStorage.getItem('theme') === 'dark' || 
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.classList.add('dark');
        }

        // Initialize Feather Icons
        document.addEventListener('DOMContentLoaded', () => {
            feather.replace();
        });

        async function fetchProfile() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}`);
                const profile = await response.json();
                
                const socialLinksHTML = Object.entries(socialLinks)
                    .map(([platform, handle]) => `
                        <a href="https://${platform}.com/${handle}" target="_blank" class="social-link">
                            <i data-feather="${platform}"></i>
                            <span>${platform.charAt(0).toUpperCase() + platform.slice(1)}</span>
                        </a>
                    `).join('');

                document.getElementById('profile').innerHTML = `
                    <div class="profile-card">
                        <div class="avatar-container">
                            <img src="${profile.avatar_url}" alt="Profile" class="avatar">
                        </div>
                        <div>
                            <h1 class="name">${profile.name || username}</h1>
                            <p class="bio">${profile.bio || 'Software Developer passionate about creating innovative solutions'}</p>
                            <div class="stats">
                                <span><i data-feather="users"></i> ${profile.followers.toLocaleString()} followers</span>
                                <span><i data-feather="user"></i> ${profile.following.toLocaleString()} following</span>
                                ${profile.location ? `<span><i data-feather="map-pin"></i> ${profile.location}</span>` : ''}
                            </div>
                            <div class="social-links">
                                ${socialLinksHTML}
                            </div>
                        </div>
                    </div>
                `;
                feather.replace();
            } catch (error) {
                document.getElementById('profile').innerHTML = `
                    <p>Error loading profile. Please check the username and try again.</p>
                `;
            }
        }

        async function fetchRepos() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=6`);
                const repos = await response.json();
                
                document.getElementById('repos').innerHTML = `
                    <h2 style="font-size: 1.75rem; font-weight: 600; margin-bottom: 1.5rem;">Latest Projects</h2>
                    <div class="repos-grid">
                        ${repos.map(repo => `
                            <div class="repo-card">
                                <a href="${repo.html_url}" target="_blank" class="repo-name">
                                    <i data-feather="github"></i> ${repo.name}
                                </a>
                                <p class="repo-desc">${repo.description || 'No description available'}</p>
                                <div class="repo-stats">
                                    <span><i data-feather="star"></i> ${repo.stargazers_count}</span>
                                    <span><i data-feather="git-branch"></i> ${repo.forks_count}</span>
                                    ${repo.language ? `<span><i data-feather="code"></i> ${repo.language}</span>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                feather.replace();
            } catch (error) {
                document.getElementById('repos').innerHTML = `
                    <p>Error loading repositories. Please try again later.</p>
                `;
            }
        }

        fetchProfile();
        fetchRepos();
    </script>
</body>
</html>
