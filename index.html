<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nishant Luhera Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        :root {
            --primary: #8B5CF6; /* Purple/Lilac branding */
            --primary-light: #C4B5FD;
            --bg: #F9FAFB;
            --text: #111827;
            --card-bg: #FFFFFF;
            --card-border: #E5E7EB;
            --hover-bg: #F3E8FF;
            --max-width: 1200px;
            --content-padding: 2rem;
            --transition: all 0.3s ease;
        }

        .dark {
            --primary: #C4B5FD;
            --primary-light: #EDE9FE;
            --bg: #1F2937;
            --text: #F9FAFB;
            --card-bg: #374151;
            --card-border: #4B5563;
            --hover-bg: #5B21B6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: var(--transition);
        }

        .container {
            padding: var(--content-padding);
            max-width: var(--max-width);
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 0.6rem 1rem;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            background: var(--hover-bg);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .repos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .repo-card {
            padding: 1.5rem;
            border-radius: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            transition: var(--transition);
            cursor: pointer;
        }

        .repo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .repo-card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .repo-card p {
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .repo-card .repo-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
        }

        .social-links {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .social-links a {
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
            transition: var(--transition);
        }

        .social-links a:hover {
            text-decoration: underline;
            color: var(--primary-light);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Nishant Luhera Portfolio</h1>
            <button class="theme-toggle" onclick="toggleTheme()">🌓 Switch Theme</button>
        </div>

        <div id="profile" class="card"></div>
        <div id="stats" class="card"></div>

        <h2 class="section-title">Social Links</h2>
        <div class="card">
            <div class="social-links">
                <a href="https://www.linkedin.com/in/nishantkluhera/" target="_blank">LinkedIn</a>
                <a href="https://x.com/nishantluhera" target="_blank">Twitter</a>
                <a href="https://github.com/nishantkluhera" target="_blank">GitHub</a>
            </div>
        </div>

        <h2 class="section-title">GitHub Stats</h2>
        <div id="github-stats" class="card"></div>

        <h2 class="section-title">My Repositories</h2>
        <div id="repos" class="repos-grid"></div>

        <h2 class="section-title">Shared Account Repositories</h2>
        <div id="shared-repos" class="repos-grid"></div>

        <h2 class="section-title">LeetCode Stats</h2>
        <div id="leetcode" class="card"></div>
    </div>

    <script>
        const config = {
            github: 'nishantkluhera',
            sharedGithub: 'projects506',
            leetcode: 'nishantluhera'
        };

        function toggleTheme() {
            document.body.classList.toggle('dark');
            localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        }

        async function fetchProfile(username, elementId) {
            const element = document.getElementById(elementId);
            try {
                const response = await fetch(`https://api.github.com/users/${username}`);
                const profile = await response.json();

                element.innerHTML = `
                    <h2>${profile.name || profile.login}</h2>
                    <p>${profile.bio || "No bio available."}</p>
                    <div class="stats">
                        <span>👨‍💻 ${profile.public_repos} Repos</span>
                        <span>⭐ ${profile.followers} Followers</span>
                        <span>👥 ${profile.following} Following</span>
                    </div>
                `;
            } catch (error) {
                console.error(`Error fetching profile for ${username}:`, error);
            }
        }

        async function fetchRepos(username, elementId) {
            const element = document.getElementById(elementId);
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos`);
                const repos = await response.json();

                element.innerHTML = repos.map(repo => `
                    <div class="repo-card" onclick="window.open('${repo.html_url}', '_blank')">
                        <h3>${repo.name}</h3>
                        <p>${repo.description || "No description available."}</p>
                        <div class="repo-stats">
                            <span>⭐ ${repo.stargazers_count}</span>
                            <span>🍴 ${repo.forks_count}</span>
                        </div>
                    </div>`).join('');
            } catch (error) {
                console.error(`Error fetching repositories for ${username}:`, error);
            }
        }

        async function fetchLeetCodeStats(username) {
            const element = document.getElementById('leetcode');
            try {
                const response = await fetch(`https://leetcode-stats-api.herokuapp.com/${username}`);
                const stats = await response.json();

                element.innerHTML = `
                    <h3>LeetCode Stats</h3>
                    <p>Total Problems Solved: ${stats.totalSolved}</p>
                    <p>Easy: ${stats.easySolved}</p>
                    <p>Medium: ${stats.mediumSolved}</p>
                    <p>Hard: ${stats.hardSolved}</p>
                    <p>Rank: ${stats.ranking}</p>
                `;
            } catch (error) {
                console.error(`Error fetching LeetCode stats for ${username}:`, error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchProfile(config.github, 'profile');
            fetchRepos(config.github, 'repos');
            fetchRepos(config.sharedGithub, 'shared-repos');
            fetchLeetCodeStats(config.leetcode);

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark');
            }
        });
    </script>
</body>
</html>
