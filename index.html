<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub baisc Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        :root {
            --primary: #4F46E5;
            --primary-light: #818CF8;
            --bg: #F9FAFB;
            --text: #111827;
            --card-bg: #FFFFFF;
            --card-border: #E5E7EB;
            --hover-bg: #EFF6FF;
            --max-width: 1200px;
            --content-padding: 2rem;
            --transition: all 0.3s ease;
        }

        .dark {
            --primary: #818CF8;
            --primary-light: #A5B4FC;
            --bg: #1F2937;
            --text: #F9FAFB;
            --card-bg: #374151;
            --card-border: #4B5563;
            --hover-bg: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: var(--transition);
        }

        .container {
            padding: var(--content-padding);
            max-width: var(--max-width);
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 0.6rem 1rem;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            background: var(--hover-bg);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .profile img {
            border-radius: 50%;
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 3px solid var(--primary);
        }

        .profile-details {
            flex: 1;
        }

        .profile-details h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .profile-details p {
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .social-links {
            display: flex;
            gap: 1rem;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            color: var(--text);
            transition: var(--transition);
            text-decoration: none;
        }

        .social-link:hover {
            background: var(--hover-bg);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .repos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .repo-card {
            padding: 1.5rem;
            border-radius: 1rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            transition: var(--transition);
        }

        .repo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .repo-card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .repo-card p {
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .repo-card .repo-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Nishant Portfolio</h1>
            <button class="theme-toggle" onclick="toggleTheme()">🌓 Switch Theme</button>
        </div>

        <div id="profile" class="card"></div>

        <h2 class="section-title">Repositories</h2>
        <div id="repos" class="repos-grid"></div>
    </div>

    <script>
        const config = {
            github: 'nishantkluhera',
            social: {
                linkedin: 'https://www.linkedin.com/in/nishantkluhera/',
                //twitter: 'https://twitter.com/your-profile',
                //instagram: 'https://instagram.com/your-profile',
                //medium: 'https://medium.com/@your-profile'
            }
        };

        function toggleTheme() {
            document.body.classList.toggle('dark');
            localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        }

        async function fetchProfile() {
            const profileElement = document.getElementById('profile');
            try {
                const response = await fetch(`https://api.github.com/users/${config.github}`);
                const profile = await response.json();

                profileElement.innerHTML = `
                    <div class="profile">
                        <img src="${profile.avatar_url}" alt="${profile.name}">
                        <div class="profile-details">
                            <h2>${profile.name || config.github}</h2>
                            <p>${profile.bio || "Developer passionate about building cool things!"}</p>
                            <div class="social-links">
                                ${Object.entries(config.social).map(([key, url]) => `
                                    <a href="${url}" class="social-link" target="_blank">
                                        <i data-feather="${key}"></i>
                                    </a>`).join('')}
                            </div>
                        </div>
                    </div>`;
                feather.replace();
            } catch (error) {
                console.error('Error fetching profile:', error);
            }
        }

        async function fetchRepos() {
            const reposElement = document.getElementById('repos');
            try {
                const response = await fetch(`https://api.github.com/users/${config.github}/repos`);
                const repos = await response.json();

                reposElement.innerHTML = repos.map(repo => `
                    <div class="repo-card">
                        <h3>${repo.name}</h3>
                        <p>${repo.description || "No description available."}</p>
                        <div class="repo-stats">
                            <span>⭐ ${repo.stargazers_count}</span>
                            <span>🍴 ${repo.forks_count}</span>
                        </div>
                    </div>`).join('');
            } catch (error) {
                console.error('Error fetching repos:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchProfile();
            fetchRepos();

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark');
            }
        });
    </script>
</body>
</html>
